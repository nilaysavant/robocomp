[workspace]
resolver = "2"
members = [
    ".",
    "crates/robocomp_rapier3d",
    "crates/robocomp_avian3d",
    "crates/robocomp_test_utils",
]
default-members = ["."]

[workspace.package]
version = "0.1.0"
authors = ["Nilay Savant"]
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
bevy_rapier3d = "0.34"
avian3d = "0.6.1"
bevy_skein = "0.5"
bevy-inspector-egui = "0.36"
petgraph = "0.8"
robocomp = { path = "." }

[package]
name = "robocomp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_render"] }
bevy_skein = { workspace = true }
petgraph = { workspace = true }

[dev-dependencies]
bevy = { workspace = true, features = ["2d", "3d", "ui", "bevy_dev_tools"] }
