[package]
name = "robocomp_rapier3d"
description = "Rapier physics integration for robocomp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/robocomp_rapier3d"
exclude = ["tests/"]

[dependencies]
bevy = { workspace = true, features = ["bevy_render"] }
bevy_rapier3d = { workspace = true }
bevy_skein = { workspace = true }
robocomp = { workspace = true }

[dev-dependencies]
bevy = { workspace = true, features = ["2d", "3d", "ui", "bevy_dev_tools"] }
bevy-inspector-egui = { workspace = true }
robocomp_test_utils = { path = "../robocomp_test_utils" }
